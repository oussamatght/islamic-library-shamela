openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: quran
    description: Quran reading, tafsir, and audio
  - name: prayer
    description: Prayer times
  - name: hadith
    description: Arabic hadith
  - name: adhkar
    description: Adhkar and duas
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /quran/surahs:
    get:
      operationId: getQuranSurahs
      tags: [quran]
      summary: List Quran surahs
      responses:
        "200":
          description: Quran surahs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuranSurahList"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /quran/surahs/{surahId}:
    get:
      operationId: getQuranReader
      tags: [quran]
      summary: Read a Quran surah
      parameters:
        - $ref: "#/components/parameters/SurahId"
      responses:
        "200":
          description: Quran surah verses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuranReader"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /quran/surahs/{surahId}/audio:
    get:
      operationId: getQuranAudio
      tags: [quran]
      summary: Get a surah recitation
      parameters:
        - $ref: "#/components/parameters/SurahId"
      responses:
        "200":
          description: Surah audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTrack"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /quran/tafsir/{surahId}/{ayahNumber}:
    get:
      operationId: getQuranTafsir
      tags: [quran]
      summary: Get tafsir for an ayah
      parameters:
        - $ref: "#/components/parameters/SurahId"
        - name: ayahNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Tafsir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tafsir"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /prayer-times:
    get:
      operationId: getPrayerTimes
      tags: [prayer]
      summary: Get prayer times for a location and date
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]{2}-[0-9]{2}-[0-9]{4}$"
      responses:
        "200":
          description: Prayer times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerTimes"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /hadiths:
    get:
      operationId: getHadiths
      tags: [hadith]
      summary: List Arabic hadith
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            default: 2
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Hadith
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HadithList"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /adhkar:
    get:
      operationId: getAdhkar
      tags: [adhkar]
      summary: List Arabic adhkar
      parameters:
        - $ref: "#/components/parameters/HusnCategoryId"
      responses:
        "200":
          description: Adhkar categories and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhikrCollection"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /duas:
    get:
      operationId: getDuas
      tags: [adhkar]
      summary: List Arabic duas
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 6
      responses:
        "200":
          description: Dua categories and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhikrCollection"
        "502":
          $ref: "#/components/responses/UpstreamError"
components:
  parameters:
    SurahId:
      name: surahId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 114
    HusnCategoryId:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    UpstreamError:
      description: The live content provider could not be reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        message:
          type: string
        source:
          type: string
      required:
        - message
    QuranSurah:
      type: object
      properties:
        id:
          type: integer
        nameArabic:
          type: string
        nameEnglish:
          type: string
        revelationPlace:
          type: string
        versesCount:
          type: integer
      required: [id, nameArabic, nameEnglish, revelationPlace, versesCount]
    QuranSurahList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuranSurah"
      required: [data]
    QuranVerse:
      type: object
      properties:
        id:
          type: integer
        verseNumber:
          type: integer
        verseKey:
          type: string
        text:
          type: string
        juz:
          type: integer
        page:
          type: integer
      required: [id, verseNumber, verseKey, text, juz, page]
    QuranReader:
      type: object
      properties:
        surah:
          $ref: "#/components/schemas/QuranSurah"
        verses:
          type: array
          items:
            $ref: "#/components/schemas/QuranVerse"
      required: [surah, verses]
    AudioTrack:
      type: object
      properties:
        surahId:
          type: integer
        audioUrl:
          type: string
          format: uri
        reciter:
          type: string
        format:
          type: string
      required: [surahId, audioUrl, reciter, format]
    Tafsir:
      type: object
      properties:
        surahId:
          type: integer
        ayahNumber:
          type: integer
        resourceName:
          type: string
        text:
          type: string
      required: [surahId, ayahNumber, resourceName, text]
    PrayerTimes:
      type: object
      properties:
        date:
          type: string
        hijriDate:
          type: string
        timezone:
          type: string
        location:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
          required: [latitude, longitude]
        timings:
          type: object
          additionalProperties:
            type: string
      required: [date, hijriDate, timezone, location, timings]
    Hadith:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        text:
          type: string
        source:
          type: string
      required: [id, title, text, source]
    HadithList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hadith"
        page:
          type: integer
        totalPages:
          type: integer
      required: [data, page, totalPages]
    Dhikr:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        text:
          type: string
        translation:
          type: string
        repeat:
          type: integer
        audioUrl:
          type: string
          format: uri
      required: [id, title, text, repeat]
    DhikrCategory:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dhikr"
      required: [id, title, items]
    DhikrCollection:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DhikrCategory"
      required: [categories]

