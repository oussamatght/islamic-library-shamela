kind = "mobile"
previewPath = "/"
title = "Sakinah"
description = "A premium Arabic-first Islamic companion for a single user, bringing Quran reading, prayer times, adhkar, hadith, and calm daily guidance into one private mobile experience."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "npm run dev --workspace=@workspace/mobile"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/mobile" ]
run = [ "npm", "run", "serve", "--workspace=@workspace/mobile" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
